# Every "system" is something you evaluate end-to-end on the same test cases.
# Model IDs and prices change often. Check before trusting the numbers below:
#   python -m yks.list_models fireworks oss qwen      # Fireworks serverless IDs
#   python -m yks.list_models tunable                  # Fireworks fine-tunable base models
#   python -m yks.list_models bedrock                  # Bedrock OpenAI/Anthropic IDs + inference profiles
# Token prices are USD per 1M tokens and are used to ESTIMATE cost from measured token usage.

providers:
  fireworks:
    type: openai_compat
    base_url: https://api.fireworks.ai/inference/v1
    api_key_env: FIREWORKS_API_KEY
  bedrock:
    type: bedrock_converse        # boto3 Converse API, standard AWS credential chain
    region: us-east-1
    # profile: my-aws-profile     # optional; otherwise AWS_PROFILE / default credentials
  openai:                         # optional: OpenAI direct, if you prefer it over Bedrock
    type: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

models:
  # ---- Frontier baselines on Amazon Bedrock (US geo cross-region inference profiles)
  # Latest OpenAI / Anthropic models visible in this account on 2026-11-02 (list_models bedrock).
  gpt-6.1-sol:
    provider: bedrock
    model: us.openai.gpt-6.1-sol
    price_in: 2.20               # Bedrock model card: US CRIS, Standard, <=272K input
    price_out: 11.00
    price_cache_read: 0.11
    price_cache_write: 2.75
    params: {max_tokens: 32000}  # model-default reasoning; don't starve the baseline of tokens
  claude-opus-5.5:
    provider: bedrock
    model: us.anthropic.claude-opus-5-5
    price_in: 4.00               # Anthropic list $4/$20; TODO confirm Bedrock US-geo rate on aws.amazon.com/bedrock/pricing
    price_out: 20.00
    price_cache_read: 0.20       # Anthropic list; TODO confirm Bedrock rate
    price_cache_write: 5.00
    # Adaptive thinking is always on (default effort: medium). No sampling params.
    params: {max_tokens: 32000}

  # ---- Open models on Fireworks serverless (verify IDs with list_models)
  gpt-oss-120b:
    provider: fireworks
    model: accounts/fireworks/models/gpt-oss-120b
    price_in: 0.15
    price_out: 0.60
    price_cache_read: 0.015      # Fireworks serverless pricing table
    params: {max_tokens: 16000, reasoning_effort: medium}
  # Tunable AND serverless (checked with list_models on 2026-11-02): cheapest base to benchmark.
  nemotron-lightning:
    provider: fireworks
    model: accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b
    size_b: 31.58                # MoE: ~3B active params per token
    family: Nemotron
    price_in: 0.05               # Fireworks serverless pricing table
    price_cache_read: 0.01
    price_out: 0.20
    # Occasionally loops until the cap (seen in smoke test): 8K cap makes runaways fail fast.
    params: {max_tokens: 8000, reasoning_effort: medium}

  # ---- Fine-tunable small-model ladder (Fireworks managed SFT, from docs.fireworks.ai/fine-tuning/models,
  # checked 2026-11-02). size_b / family drive yks.plot_finetune. If a base model isn't callable on
  # serverless, deploy it (`firectl deployment create accounts/fireworks/models/<id>`), put the
  # deployment's model string in `model`, and switch to billing: gpu_hour like the fine-tuned models,
  # so base vs fine-tuned are costed the same way.
  qwen3-0.6b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3-0p6b
    size_b: 0.75
    family: Qwen 3
    price_in: 0.10               # size-tier (<4B)
    price_out: 0.10
    params: {max_tokens: 16000}
  ministral-3b:
    provider: fireworks
    model: accounts/fireworks/models/ministral-3-3b-instruct-2512
    size_b: 3.0
    family: Mistral
    price_in: 0.10
    price_out: 0.10
    params: {max_tokens: 16000}
  llama3.2-3b:
    provider: fireworks
    model: accounts/fireworks/models/llama-v3p2-3b-instruct
    size_b: 3.61
    family: Llama
    price_in: 0.10
    price_out: 0.10
    params: {max_tokens: 16000}
  qwen3-4b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3-4b
    size_b: 4.41
    family: Qwen 3
    price_in: 0.20               # size-tier (4B-16B)
    price_out: 0.20
    params: {max_tokens: 16000}
  qwen3-8b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3-8b
    size_b: 8.19
    family: Qwen 3
    price_in: 0.20               # size-tier price (4B-16B)
    price_out: 0.20
    params: {max_tokens: 16000}
  llama3.1-8b:
    provider: fireworks
    model: accounts/fireworks/models/llama-v3p1-8b-instruct
    size_b: 8.84
    family: Llama
    price_in: 0.20
    price_out: 0.20
    params: {max_tokens: 16000}
  qwen3.5-9b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3p5-9b
    size_b: 9.41
    family: Qwen 3.5
    price_in: 0.20
    price_out: 0.20
    params: {max_tokens: 16000}
  qwen3-14b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3-14b
    size_b: 14.77
    family: Qwen 3
    price_in: 0.20
    price_out: 0.20
    params: {max_tokens: 16000}
  qwen3-32b:
    provider: fireworks
    model: accounts/fireworks/models/qwen3-32b
    size_b: 32.76
    family: Qwen 3
    price_in: 0.90               # size-tier (>16B)
    price_out: 0.90
    params: {max_tokens: 16000}

  # ---- Your fine-tuned model (see docs/FINETUNE.md). Trained models are served on a
  # dedicated deployment, billed per GPU-hour, so set billing: gpu_hour.
  # finetuned_from links it to its base on the chart (arrow + "+X pp"). Chain stages the same way,
  # e.g. a DPO model with finetuned_from: yks-sft.
  yks-sft:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft-nemotron   # set to the deployment route after deploy
    finetuned_from: nemotron-lightning
    size_b: 31.58
    family: Nemotron
    label: "Nemotron-30B-A3B + YKS SFT (ours)"
    billing: gpu_hour
    params: {max_tokens: 8000, reasoning_effort: medium}   # identical to its base
    gpu_hour_usd: 13.00          # set at runtime by yks.deploy_sft from the deployed shape
    gpus: 1                      # TODO: GPUs in the deployment shape

  # Parallel SFT on the Qwen3 ladder (same 517-row dataset, LoRA rank 8, jobs yks-sft-qwen3-*-1334).
  sft-qwen3-0.6b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft-qwen3-0p6b
    finetuned_from: qwen3-0.6b
    size_b: 0.75
    family: Qwen 3
    label: "Qwen3-0.6B + SFT (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}
  sft-qwen3-4b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft-qwen3-4b
    finetuned_from: qwen3-4b
    size_b: 4.41
    family: Qwen 3
    label: "Qwen3-4B + SFT (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}
  sft-qwen3-8b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft-qwen3-8b
    finetuned_from: qwen3-8b
    size_b: 8.19
    family: Qwen 3
    label: "Qwen3-8B + SFT (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}
  sft-qwen3-14b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft-qwen3-14b
    finetuned_from: qwen3-14b
    size_b: 14.77
    family: Qwen 3
    label: "Qwen3-14B + SFT (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}

  # SFT v2: same questions, targets include gpt-oss-120b reasoning traces (reasoning_content).
  sft2-qwen3-4b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft2-qwen3-4b
    finetuned_from: qwen3-4b
    size_b: 4.41
    family: Qwen 3
    label: "Qwen3-4B + SFT v2 (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}
  sft2-qwen3-8b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft2-qwen3-8b
    finetuned_from: qwen3-8b
    size_b: 8.19
    family: Qwen 3
    label: "Qwen3-8B + SFT v2 (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}
  sft2-qwen3-14b:
    provider: fireworks
    model: accounts/YOUR_FIREWORKS_ACCOUNT/models/yks-sft2-qwen3-14b
    finetuned_from: qwen3-14b
    size_b: 14.77
    family: Qwen 3
    label: "Qwen3-14B + SFT v2 (ours)"
    billing: gpu_hour
    params: {max_tokens: 16000}

systems:
  # Frontier baselines (report one as --baseline, keep the other as a second reference)
  gpt-6.1-sol:         {strategy: single, model: gpt-6.1-sol}
  claude-opus-5.5:     {strategy: single, model: claude-opus-5.5}
  # Strongest-effort variant, so nobody can say the baseline was weakened
  claude-opus-5.5-high:
    strategy: single
    model: claude-opus-5.5
    params: {additional_fields: {output_config: {effort: high}}}

  # Size sweep: "how small can we go?"
  oss120:              {strategy: single, model: gpt-oss-120b}
  qwen8:               {strategy: single, model: qwen3-8b}

  nemotron-lightning:  {strategy: single, model: nemotron-lightning}

  # Fine-tunable ladder (each system name = its model name, for plot_finetune)
  qwen3-0.6b:          {strategy: single, model: qwen3-0.6b}
  ministral-3b:        {strategy: single, model: ministral-3b}
  llama3.2-3b:         {strategy: single, model: llama3.2-3b}
  qwen3-4b:            {strategy: single, model: qwen3-4b}
  qwen3-8b:            {strategy: single, model: qwen3-8b}
  llama3.1-8b:         {strategy: single, model: llama3.1-8b}
  qwen3.5-9b:          {strategy: single, model: qwen3.5-9b}
  qwen3-14b:           {strategy: single, model: qwen3-14b}
  qwen3-32b:           {strategy: single, model: qwen3-32b}

  # Knob sweep: reasoning effort (latency/cost vs accuracy)
  nemo-low:           {strategy: single, model: nemotron-lightning, params: {reasoning_effort: low}}
  nemo-high:          {strategy: single, model: nemotron-lightning, params: {reasoning_effort: high}}

  # Test-time compute: majority vote over k samples
  nemo-sc5:           {strategy: self_consistency, model: nemotron-lightning, k: 5, params: {temperature: 0.7}}

  # Cascade: cheap model votes, escalate to a bigger open model only when it disagrees with itself
  cascade-nemo-120:
    strategy: cascade
    small: nemotron-lightning
    k: 3
    small_params: {temperature: 0.7}
    large: gpt-oss-120b
    large_params: {reasoning_effort: high}
    escalate_if_agreement_below: 1.0   # 1.0 = escalate unless all k votes agree

  # Exam mode: real YKS scoring (+1 / -0.25 / blank 0); the model may answer "BOŞ".
  # Compare net/40 against the standard-mode twin to measure calibrated abstention.
  claude-opus-5.5-exam: {strategy: single, model: claude-opus-5.5, prompt: exam}
  nemo-exam:           {strategy: single, model: nemotron-lightning, prompt: exam}
  # Abstain when self-consistency votes disagree too much is another option: cascade with prompt: exam
  cascade-nemo-120-exam:
    strategy: cascade
    prompt: exam
    small: nemotron-lightning
    k: 3
    small_params: {temperature: 0.7}
    large: gpt-oss-120b
    large_params: {reasoning_effort: high}
    escalate_if_agreement_below: 1.0

  # Olympiad track: same systems work (run with --dataset olympiad --max-tokens 32000).
  # Test-time compute matters more on hard problems, so add a wider vote:
  oss120-sc8:          {strategy: self_consistency, model: gpt-oss-120b, k: 8, params: {temperature: 0.7}}
  oss120-high:         {strategy: single, model: gpt-oss-120b, params: {reasoning_effort: high}}

  # Fine-tuned small model vs its own base (qwen8) = the fine-tuning delta
  yks-sft:             {strategy: single, model: yks-sft}
  sft-qwen3-0.6b:      {strategy: single, model: sft-qwen3-0.6b}
  sft-qwen3-4b:        {strategy: single, model: sft-qwen3-4b}
  sft-qwen3-8b:        {strategy: single, model: sft-qwen3-8b}
  sft-qwen3-14b:       {strategy: single, model: sft-qwen3-14b}
  sft2-qwen3-4b:       {strategy: single, model: sft2-qwen3-4b}
  sft2-qwen3-8b:       {strategy: single, model: sft2-qwen3-8b}
  sft2-qwen3-14b:      {strategy: single, model: sft2-qwen3-14b}
